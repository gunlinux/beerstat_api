{% extends "base.html" %}

{% block content %}
<div class="admin">
  <h2>New Widget</h2>
  <form method="post" action="/admin/widget/new">
    <label>Name<input name="name" required></label>
    <label>Timeout (s)<input name="timeout" type="number" min="1" required></label>
    <label>Showtime (s)<input name="showtime" type="number" value="{{ default_showtime }}" min="1" required></label>
    <label>Template<textarea name="template" required></textarea></label>
    <button type="submit">Create</button>
    <a href="/admin/">Cancel</a>
  </form>
</div>
{% endblock %}
