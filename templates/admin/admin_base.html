<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BeerStat Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
    crossorigin="anonymous"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-secondary">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-semibold text-light" href="/admin/">BeerStat Admin</a>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link{% if request.url.path == '/admin/' %} active fw-semibold{% endif %}"
             href="/admin/">Widgets</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if '/donations' in request.url.path %} active fw-semibold{% endif %}"
             href="/admin/donations/">Donations</a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
